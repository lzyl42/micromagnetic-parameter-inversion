dataset_name: cofeb_protocol_b_a2_sobol1024_v1
run_name: cnn1d_logalpha_seed42
data:
  pulse_order:
  - pulse_A2
model:
  kind: cnn1d
  channels:
  - 8
  - 16
  kernel_sizes:
  - 5
  - 5
  pool_bins: 16
  head_hidden_dims:
  - 16
label:
  transform: logalpha
preprocessing:
  std_eps: 1.0e-08
training:
  seed: 42
  device: cuda
  batch_size: 32
  max_epochs: 500
  learning_rate: 0.001
  weight_decay: 0.0
  early_stopping:
    patience: 50
    min_delta: 0.0
split:
  seed: 42
  ratios:
    train: 0.7
    val: 0.15
    test: 0.15
  min_per_split:
    train: 2
    val: 1
    test: 1
output_dir: artifacts/experiments/cnn1d_multiseed_v1/runs/logalpha_seed42
