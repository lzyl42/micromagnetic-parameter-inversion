# MuMax3 simulation config: Protocol B (fixed-discrete benchmark, training-first).
# Nature: this file fixes a synthetic benchmark protocol on a discrete grid -- choices
# such as cells/EdgeSmooth are fixed conventions, not proven mesh-converged for the
# continuous model and not validated for real devices; a fixed-discrete benchmark is
# not a mesh-convergence protocol. Changing any fixed field = protocol change, and
# dataset_name must be changed (data from different protocols must not be mixed).
# Fields to fill in: only dataset_name, material.alpha, and material.ku_j_per_m3 are
# kept as null and must be filled before running; load_config rejects any required
# research value that is still null.
# Units: SI throughout; the only exception is the external-field amplitude written in
# mT (b_ext_amplitude_mT), which load_config immediately multiplies by 1e-3 at the
# boundary; the runtime model and computation use only T.
# 0 K synthetic material model without thermal noise: no temperature/thermal-noise
# schema fields are added.

dataset_name: null # Dataset name; required before running. The example name cofeb_discrete_a2_v1 is format-only and not filled into the template; each protocol must be renamed per its own protocol before filling. Output root data/raw/<dataset_name>/

material: # Single uniform material (0 K, no thermal noise; synthetic CoFeB-inspired magnitude)
  ms_a_per_m: 1.25e+6 # Saturation magnetization, A/m (fixed)
  aex_j_per_m: 15.0e-12 # Exchange stiffness constant, J/m (fixed)
  alpha: null # Gilbert damping coefficient (inversion target), dimensionless; required before running
  ku_j_per_m3: null # Uniaxial anisotropy constant (inversion target), J/m^3; required before running
  anisotropy_axis: [1.0, 0.0, 0.0] # Easy-axis unit vector +x, dimensionless (fixed)

geometry: # Fixed-discrete geometry: true triaxial ellipsoid + fixed grid (not a mesh-convergence protocol)
  size_m: [100.0e-9, 50.0e-9, 2.0e-9] # Ellipsoid full diameters [dx, dy, dz], m (= bounding-box size, fixed)
  cells: [40, 20, 4] # Grid cell counts [nx, ny, nz]; fixed discrete choice, mesh convergence not proven
  # cell_size[i] = size_m[i] / cells[i] is derived by code (single source of truth); not filled in here.

initial_m: [1.0, 0.0, 0.0] # Uniform initial-state direction +x, dimensionless unit vector (fixed)

recording: # Free-decay sampling after field switch-off (fixed row count): 10 ps x 401 points = 0..4 ns after switch-off
  sample_interval_s: 10.0e-12 # Sampling interval, s (fixed)
  sample_count: 401 # Number of sample points; the first point after switch-off is sample_index=0, t_s=0 (fixed)

numerics: # Numerical protocol (explicitly rendered into both templates; changing any value = protocol change, dataset_name must be changed)
  edge_smooth: 12 # EdgeSmooth, non-negative integer; rendered before SetGeom (fixed; with ES>0 single-layer padding still follows the smoothed Ellipsoid geometry, not an equivalent constant-thickness cylinder)
  solver: 5 # SetSolver(...), MuMax3 solver ID (fixed)
  max_err: 1.0e-5 # MaxErr, positive, dimensionless (fixed)
  max_dt_s: 1.0e-11 # MaxDt, positive, s (fixed)
  gamma_ll_rad_per_t_s: 1.7595e+11 # GammaLL, positive, rad/(T*s) (fixed)
  relax_torque_threshold_t: -1.0 # RelaxTorqueThreshold, T; -1 keeps the official default convergence criterion (fixed)

pulses: # List of short rectangular pulses (Protocol B first version: only 1 pulse; multiple excitations are a follow-up comparison, not approved)
  - pulse_id: pulse_A2 # Unique pulse identifier (filled in)
    b_ext_amplitude_mT: 2.0 # Pulse amplitude, mT (load_config immediately multiplies by 1e-3 at the boundary and stores runtime T)
    direction: [0.0, 1.0, 0.0] # Pulse direction unit vector y, dimensionless
    duration_s: 50.0e-12 # Pulse duration, s; B_ext is identically 0 after switch-off
