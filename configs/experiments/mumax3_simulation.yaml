# MuMax3 模拟配置：一份配置 = 一个 (alpha, Ku) parameter set 的多脉冲实验。
# 硬约束：所有研究值为 null 占位，运行前必须全部填写为真实数值；
# load_config 会拒绝任何仍为 null 的必填研究值。本文件不提供任何默认数值。
# 单位：一律 SI；唯一例外是外场幅值以 mT 书写（b_ext_amplitude_mT，
# 内部换算为 T）。不设 seed/description/equilibration/execution/output 等字段。

dataset_name: null # 数据集名；输出根 data/raw/<dataset_name>/

material: # 单一均匀材料（0 K，无热噪声）
  ms_a_per_m: null # 饱和磁化强度，A/m
  aex_j_per_m: null # 交换刚度常数，J/m
  alpha: null # Gilbert 阻尼系数（反演目标），无量纲
  ku_j_per_m3: null # 单轴各向异性常数（反演目标），J/m^3
  anisotropy_axis: null # 易轴单位向量 [x, y, z]，无量纲

geometry: # 椭圆薄纳米磁体的包围盒与网格
  size_m: null # 包围盒尺寸 [x, y, z]，m
  cells: null # 网格单元数 [nx, ny, nz]
  # cell_size[i] = size_m[i] / cells[i] 由代码派生（单一真值），此处不填。

initial_m: null # 均匀初态方向 [x, y, z]，无量纲单位向量

recording: # 关场后自由衰减采样（固定行数）
  sample_interval_s: null # 采样间隔，s
  sample_count: null # 采样点数；关场后首点为 sample_index=0、t_s=0

pulses: # 短矩形脉冲列表（模板示例一项，可按当前实验追加多个 pulse；每项一次独立 run）
  - pulse_id: null # 脉冲唯一标识
    b_ext_amplitude_mT: null # 脉冲幅值，mT（内部换算为 T）
    direction: null # 脉冲方向单位向量 [x, y, z]，无量纲
    duration_s: null # 脉冲时长，s；关场后 B_ext 恒为 0
