# CNN1D 训练配置 —— 仅字段大纲（全文件注释），**不可执行、不可训练**。
#
# 状态：P1 配置层**已支持** `model.kind` 判别与 CNN 结构字段
# （channels/kernel_sizes/pool_bins/head_hidden_dims）的结构解析与严格校验
# （YAML 与 config_from_mapping 同一 schema）；P2 已实现网络
# （src/micromagnetic_parameter_inversion/models/cnn1d.py 的 CNN1DRegressor）并
# 有 CPU 合成单元测试；P3 已实现独立 CNN checkpoint/工厂与显式类别路由
# （training.py 的 CNNCheckpoint / save_cnn_checkpoint / load_cnn_checkpoint /
# build_cnn_model / load_any_checkpoint，与 MLP 互不接受）。但 CNN 训练循环与
# 共享 run 编排、训练入口均**尚未实现（P4）**，模型仍未接入
# `training.train_model`，训练链未接通。本文件仍是**全注释占位、字段
# 未填写**，因此 `load_config` 当前仍必然失败（没有任何有效 YAML 键，也缺
# dataset_name/run_name）。不在此填写任何超参数默认值或猜测研究值；具体取值待
# 用户批准后填写。
#
# 独立性（关键约定）：
#   - CNN 只使用与 MLP 相同的 dataset 与冻结 split；不得重切、不得选择性汇报。
#   - CNN 的 checkpoint、训练产物与预处理统计**完全独立**：不复用 MLP 权重/
#     checkpoint/已有预处理统计/训练产物；统计量由 CNN 自己在训练组上拟合，
#     val/test 不参与拟合。checkpoint 互不接受：MLP loader 拒绝 CNN 文件，
#     CNN loader 拒绝 MLP 文件；损坏文件必须报错、绝不回退。
#   - 输出目录为 output_root()/training/cnn1d/<dataset_name>/<run_name>，与
#     既有 training/mlp/... 互不影响。
#
# 复用字段（语义沿用 MLP 流程，train.md 第 3/4/7 节）：
#   - dataset_name / run_name：同 MLP 的占位约定与校验，运行前必填。
#   - data.pulse_order：null = 由所选首份协议快照冻结并记入 dataset_meta。
#   - label.transform、preprocessing.std_eps、training.*、split.*、output_dir：
#     与 MLP 配置保持同一套字段与语义。
#
# 已支持解析的模型字段（本文件不填值）：
#
# model:
#   kind: <待填写>              # "cnn1d"；缺省仅对合法旧 MLP 字段集合生效，
#                               # 缺 kind 时不得出现 CNN 字段
#   channels: <待填写>          # 非空 int 序列，各维 > 0，拒绝 bool
#   kernel_sizes: <待填写>      # 非空 int 序列，各维正奇数，与 channels
#                               # 等长，拒绝 bool
#   pool_bins: <待填写>         # int，> 0；<= T 由模型层校验，配置层不校验 > T
#   head_hidden_dims: <待填写>  # int 序列，各维 > 0，允许为空（= 直接线性
#                               # 输出），拒绝 bool
#
# 实验时记录（不设固定物理下界）：感受野 / 池化配置 / 参数量。
