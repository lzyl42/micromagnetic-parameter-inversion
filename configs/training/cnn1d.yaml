# CNN1D 训练配置 —— 仅字段大纲（全文件注释），**本文件当前不可直接执行**。
#
# 状态（P4）：CNN 训练链已接通——`training.run` 为 MLP/CNN 共用编排，
# `scripts/train_cnn1d.py` 与 `scripts/train_mlp.py` 均为其薄入口（要求
# `model.kind` 匹配，错配在读数据/建目录前早拒）。CNN 训练循环已接入
# `training.train_model`，经 CPU 合成数据的离线测试验证（小 max_epochs、
# unit-test-only 结构，**非研究配置**）；**未在正式研究数据上训练，不存在
# 可靠科研结果**。
#
# 但本文件仍是**全注释占位、无任何有效 YAML 键**（也缺 dataset_name/
# run_name），因此 `load_config` 对当前文件必然失败。**不能直接照抄运行**：
# 须先由用户逐字段审定并显式填写下列字段（尤其是 model 结构），替换
# dataset_name/run_name 后才会成为可执行配置。本仓库**不预填任何模型研究
# 超参**（channels/kernel_sizes/pool_bins/head_hidden_dims 全部留空待定）。
#
# 独立性（关键约定）：
#   - CNN 只使用与 MLP 相同的 dataset 与**冻结 split**；不得重切、不得选择性汇报。
#   - CNN 的 checkpoint、训练产物与预处理统计**完全独立**：不复用 MLP 权重/
#     checkpoint/已有预处理统计/训练产物；统计量由每次 CNN run 自己在训练组上
#     拟合，val/test 不参与拟合。checkpoint 互不接受：MLP loader 拒绝 CNN 文件，
#     CNN loader 拒绝 MLP 文件；损坏文件必须报错、绝不回退。
#   - 输出目录为 output_root()/training/cnn1d/<dataset_name>/<run_name>，与
#     既有 training/mlp/... 互不影响；output_dir 显式覆盖时原样使用。
#
# 复用字段（语义沿用 MLP 流程，train.md 第 3/4/7 节）：
#   - dataset_name / run_name：同 MLP 的占位约定与校验，运行前必填。
#   - data.pulse_order：null = 由所选首份协议快照冻结并记入 dataset_meta。
#   - label.transform、preprocessing.std_eps、training.*、split.*、output_dir：
#     与 MLP 配置保持同一套字段与语义。
#
# 已支持解析的模型字段（本文件不填值）：
#
# model:
#   kind: <待填写>              # "cnn1d"；缺省仅对合法旧 MLP 字段集合生效，
#                               # 缺 kind 时不得出现 CNN 字段
#   channels: <待填写>          # 非空 int 序列，各维 > 0，拒绝 bool
#   kernel_sizes: <待填写>      # 非空 int 序列，各维正奇数，与 channels
#                               # 等长，拒绝 bool
#   pool_bins: <待填写>         # int，> 0；<= T 由模型层校验（> T 会在训练
#                               # 构造模型时被拒绝），配置层不校验 > T
#   head_hidden_dims: <待填写>  # int 序列，各维 > 0，允许为空（= 直接线性
#                               # 输出），拒绝 bool
#
# 实验时记录（不设固定物理下界）：感受野 / 池化配置 / 参数量。
